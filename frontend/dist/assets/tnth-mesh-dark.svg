<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="secBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091e" />
      <stop offset="50%" stop-color="#061233" />
      <stop offset="100%" stop-color="#050c26" />
    </linearGradient>

    <radialGradient id="cyanAura" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7feeff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleAura" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <linearGradient id="waveLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7feeff" stop-opacity="0" />
      <stop offset="40%" stop-color="#7feeff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#secBgGrad)" />

  <!-- Ambient Glows -->
  <g filter="url(#blurFilter)">
    <circle cx="1550" cy="200" r="500" fill="url(#cyanAura)" />
    <circle cx="300" cy="850" r="600" fill="url(#purpleAura)" />
  </g>

  <!-- Flowing 3D Topographic Contour Wave Lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M -100 450 C 400 320, 800 600, 1300 420 C 1600 310, 1850 480, 2100 400" stroke="url(#waveLine1)" stroke-width="2" />
    <path d="M -100 500 C 420 370, 820 650, 1320 470 C 1620 360, 1870 530, 2100 450" stroke="url(#waveLine2)" stroke-width="1.5" />
    <path d="M -100 550 C 440 420, 840 700, 1340 520 C 1640 410, 1890 580, 2100 500" stroke="url(#waveLine1)" stroke-width="1.2" opacity="0.6" />
    <path d="M -100 600 C 460 470, 860 750, 1360 570 C 1660 460, 1910 630, 2100 550" stroke="url(#waveLine2)" stroke-width="1" opacity="0.4" />
  </g>
</svg>
