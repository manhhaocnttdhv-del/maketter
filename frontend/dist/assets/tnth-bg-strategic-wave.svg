<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03081a" />
      <stop offset="45%" stop-color="#061338" />
      <stop offset="85%" stop-color="#081e54" />
      <stop offset="100%" stop-color="#040a20" />
    </linearGradient>

    <!-- Neon Ribbon Gradients -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purpleRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="meshCenterGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#waveBg)" />

  <!-- Ambient Backdrop Glow -->
  <g filter="url(#softAura)">
    <circle cx="1400" cy="500" r="550" fill="url(#meshCenterGlow)" />
    <circle cx="1650" cy="200" r="400" fill="#a855f7" opacity="0.18" />
  </g>

  <!-- Perspective 3D Matrix Floor (Bottom-Right) -->
  <g opacity="0.25" stroke="#7feeff" stroke-width="1">
    <!-- Radiating perspective lines -->
    <line x1="1400" y1="520" x2="800" y2="1080" />
    <line x1="1400" y1="520" x2="1050" y2="1080" />
    <line x1="1400" y1="520" x2="1300" y2="1080" />
    <line x1="1400" y1="520" x2="1550" y2="1080" />
    <line x1="1400" y1="520" x2="1800" y2="1080" />
    <line x1="1400" y1="520" x2="2000" y2="1080" />
    <line x1="1400" y1="520" x2="2100" y2="850" />
    <line x1="1400" y1="520" x2="2100" y2="650" />

    <!-- Concentric perspective rings / grid arcs -->
    <ellipse cx="1400" cy="520" rx="150" ry="60" fill="none" />
    <ellipse cx="1400" cy="520" rx="300" ry="120" fill="none" stroke-dasharray="8 6" />
    <ellipse cx="1400" cy="520" rx="500" ry="200" fill="none" />
    <ellipse cx="1400" cy="520" rx="750" ry="300" fill="none" stroke-dasharray="14 8" />
  </g>

  <!-- Fluid 3D Kinetic Wave Strands -->
  <g filter="url(#waveGlow)" fill="none" stroke-linecap="round">
    <path d="M 600 -50 C 950 200, 1200 450, 1600 350 C 1850 280, 1950 150, 2050 50" stroke="url(#cyanRibbon)" stroke-width="4.5" />
    <path d="M 550 50 C 900 320, 1150 560, 1580 440 C 1880 340, 2000 240, 2100 120" stroke="url(#purpleRibbon)" stroke-width="3.5" />
    <path d="M 680 120 C 1020 400, 1250 620, 1680 500 C 1920 420, 2050 320, 2150 220" stroke="url(#cyanRibbon)" stroke-width="2.5" opacity="0.8" />
    <path d="M 750 220 C 1100 500, 1320 700, 1750 580 C 1980 500, 2100 400, 2200 300" stroke="url(#purpleRibbon)" stroke-width="2" opacity="0.6" />
    
    <!-- Light Trail Sweeps -->
    <path d="M 850 350 C 1200 620, 1400 780, 1850 680" stroke="#7feeff" stroke-width="1.2" stroke-dasharray="25 15 5 15" opacity="0.7" />
    <path d="M 950 450 C 1280 700, 1480 840, 1920 760" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="40 20" opacity="0.5" />
  </g>

  <!-- Floating Strategic Metric Cubes (Isometric Micro Geometry) -->
  <g transform="translate(1620, 320)" opacity="0.75" stroke="#7feeff" stroke-width="1.2" fill="rgba(127, 238, 255, 0.06)">
    <!-- Cube 1 -->
    <polygon points="0,-25 22,-12 22,12 0,-1" />
    <polygon points="0,-25 -22,-12 -22,12 0,-1" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" />
    <polygon points="0,-1 22,12 0,25 -22,12" />
  </g>
  <g transform="translate(1780, 580) scale(0.7)" opacity="0.6" stroke="#c084fc" stroke-width="1.2" fill="rgba(192, 132, 252, 0.08)">
    <!-- Cube 2 -->
    <polygon points="0,-25 22,-12 22,12 0,-1" />
    <polygon points="0,-25 -22,-12 -22,12 0,-1" stroke="#7feeff" />
    <polygon points="0,-1 22,12 0,25 -22,12" />
  </g>

  <!-- Left Shadow Gradients for Readability -->
  <rect width="850" height="100%" fill="url(#leftGradientFade)" />
  <defs>
    <linearGradient id="leftGradientFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03081a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#03081a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#03081a" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
