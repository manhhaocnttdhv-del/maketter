<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030719" />
      <stop offset="40%" stop-color="#051030" />
      <stop offset="75%" stop-color="#081846" />
      <stop offset="100%" stop-color="#040b22" />
    </linearGradient>

    <!-- Glowing Radial Auras -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7feeff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#00b4d8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Linear Gradients -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7feeff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7feeff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Blur Filters -->
    <filter id="heavyBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <filter id="medBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="subtleGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(127, 238, 255, 0.04)" stroke-width="1" />
      <circle cx="60" cy="0" r="1.5" fill="rgba(127, 238, 255, 0.12)" />
    </pattern>

    <!-- Light Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7feeff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050d2a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Base Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- 2. Ambient Atmosphere Aura Glows (Blurred) -->
  <g filter="url(#heavyBlur)">
    <!-- Cyan glow top right -->
    <circle cx="1650" cy="250" r="450" fill="url(#cyanGlow)" />
    <!-- Purple glow bottom right -->
    <circle cx="1500" cy="850" r="550" fill="url(#purpleGlow)" />
    <!-- Blue glow center left -->
    <circle cx="350" cy="500" r="500" fill="url(#blueGlow)" />
    <!-- Accent cyan top left -->
    <circle cx="100" cy="100" r="300" fill="url(#cyanGlow)" opacity="0.6" />
  </g>

  <!-- 3. Tech Dot & Grid Layer with Radial Mask -->
  <rect width="100%" height="100%" fill="url(#subtleGrid)" opacity="0.85" />

  <!-- 4. Diagonal Light Beams (Cinematic) -->
  <polygon points="1200,0 1600,0 1000,1080 600,1080" fill="url(#beamGrad)" />
  <polygon points="1500,0 1850,0 1350,1080 1000,1080" fill="url(#beamGrad)" opacity="0.6" />

  <!-- 5. "ROUND TO UNBOUND" Futuristic Orbital Rings & Reticles (Right Side Feature) -->
  <g transform="translate(1420, 540)" filter="url(#glowFilter)">
    <!-- Outer Unbound Orbit 1 -->
    <ellipse cx="0" cy="0" rx="420" ry="380" fill="none" stroke="url(#ringGrad1)" stroke-width="1.8" stroke-dasharray="14 10 4 10" transform="rotate(-25)" opacity="0.5" />
    
    <!-- Outer Unbound Orbit 2 -->
    <ellipse cx="0" cy="0" rx="360" ry="320" fill="none" stroke="url(#ringGrad2)" stroke-width="2.2" stroke-dasharray="80 30 180 40" transform="rotate(35)" opacity="0.65" />
    
    <!-- Core Brand Vision Ring -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="rgba(127, 238, 255, 0.4)" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4" />
    <circle cx="0" cy="0" r="220" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" opacity="0.75" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" stroke-dasharray="40 15 5 15" transform="rotate(70)" />

    <!-- Crosshair / Reticle Lines (Vision Theme) -->
    <line x1="-320" y1="0" x2="-240" y2="0" stroke="#7feeff" stroke-width="2" opacity="0.6" />
    <line x1="240" y1="0" x2="320" y2="0" stroke="#7feeff" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="-320" x2="0" y2="-240" stroke="#7feeff" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="240" x2="0" y2="320" stroke="#7feeff" stroke-width="2" opacity="0.6" />

    <!-- Orbital Energy Nodes -->
    <circle cx="200" cy="-90" r="5" fill="#7feeff" />
    <circle cx="200" cy="-90" r="12" fill="none" stroke="#7feeff" stroke-width="1" opacity="0.5" />
    
    <circle cx="-160" cy="150" r="4" fill="#c084fc" />
    <circle cx="-290" cy="-60" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="90" cy="270" r="3.5" fill="#7feeff" opacity="0.7" />
  </g>

  <!-- 6. Floating Ambient Star Dust / Tech Particles -->
  <g opacity="0.75">
    <circle cx="220" cy="180" r="2" fill="#7feeff" opacity="0.6" />
    <circle cx="340" cy="290" r="1.5" fill="#ffffff" opacity="0.5" />
    <circle cx="160" cy="720" r="2" fill="#c084fc" opacity="0.7" />
    <circle cx="480" cy="850" r="1.5" fill="#7feeff" opacity="0.4" />
    <circle cx="820" cy="160" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="950" cy="340" r="1.5" fill="#7feeff" opacity="0.5" />
    <circle cx="780" cy="760" r="2" fill="#38bdf8" opacity="0.6" />
    <circle cx="1120" cy="890" r="1.5" fill="#ffffff" opacity="0.4" />
    <circle cx="1780" cy="140" r="2" fill="#7feeff" opacity="0.8" />
    <circle cx="1860" cy="420" r="1.5" fill="#c084fc" opacity="0.5" />
    <circle cx="1690" cy="980" r="2.5" fill="#7feeff" opacity="0.7" />
  </g>

  <!-- 7. Bottom Shadow Fade for Smooth Section Transitions -->
  <rect y="920" width="100%" height="160" fill="url(#bottomFade)" />
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040b22" stop-opacity="0" />
      <stop offset="100%" stop-color="#040b22" stop-opacity="0.9" />
    </linearGradient>
  </defs>
</svg>
