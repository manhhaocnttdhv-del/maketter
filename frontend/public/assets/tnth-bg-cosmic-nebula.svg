<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Space Base -->
    <linearGradient id="cosmicBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020514" />
      <stop offset="35%" stop-color="#050e2b" />
      <stop offset="70%" stop-color="#081845" />
      <stop offset="100%" stop-color="#03081b" />
    </linearGradient>

    <!-- Nebula Cloud Gradients -->
    <radialGradient id="nebulaCyan" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#002244" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaViolet" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#2e1065" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaElectric" cx="30%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#7feeff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cosmicBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="85" />
    </filter>
  </defs>

  <!-- Base Cosmos -->
  <rect width="100%" height="100%" fill="url(#cosmicBase)" />

  <!-- Luminous Nebulae Layer -->
  <g filter="url(#cosmicBlur)">
    <circle cx="1500" cy="360" r="550" fill="url(#nebulaCyan)" />
    <circle cx="1600" cy="750" r="600" fill="url(#nebulaViolet)" />
    <circle cx="450" cy="850" r="500" fill="url(#nebulaElectric)" />
    <ellipse cx="1300" cy="500" rx="700" ry="300" fill="#3b82f6" opacity="0.15" transform="rotate(-18 1300 500)" />
  </g>

  <!-- Constellation Geometric Nexus & Portals (Right Side) -->
  <g transform="translate(1450, 480)" opacity="0.85">
    <!-- Star Nexus Rings -->
    <circle cx="0" cy="0" r="320" fill="none" stroke="#7feeff" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
    <circle cx="0" cy="0" r="260" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="18 12 60 12" opacity="0.5" transform="rotate(45)" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="120 40" opacity="0.7" transform="rotate(-30)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />

    <!-- Constellation Connectors -->
    <line x1="-180" y1="90" x2="-80" y2="-120" stroke="#7feeff" stroke-width="1" opacity="0.4" />
    <line x1="-80" y1="-120" x2="120" y2="-150" stroke="#7feeff" stroke-width="1" opacity="0.5" />
    <line x1="120" y1="-150" x2="220" y2="40" stroke="#c084fc" stroke-width="1.2" opacity="0.6" />
    <line x1="220" y1="40" x2="90" y2="180" stroke="#7feeff" stroke-width="1" opacity="0.4" />
    <line x1="90" y1="180" x2="-180" y2="90" stroke="#38bdf8" stroke-width="1" opacity="0.35" />

    <!-- Major Stars -->
    <circle cx="-180" cy="90" r="4" fill="#ffffff" />
    <circle cx="-80" cy="-120" r="5" fill="#7feeff" />
    <circle cx="120" cy="-150" r="6" fill="#ffffff" />
    <circle cx="220" cy="40" r="7" fill="#c084fc" />
    <circle cx="90" cy="180" r="4.5" fill="#7feeff" />
    <circle cx="0" cy="0" r="8" fill="url(#starGlow)" />
  </g>

  <!-- Star Field / Micro Particles across canvas -->
  <g opacity="0.9">
    <!-- Bright Pulsing Stars -->
    <circle cx="150" cy="120" r="2.5" fill="#ffffff" />
    <circle cx="150" cy="120" r="8" fill="#7feeff" opacity="0.4" />
    <circle cx="850" cy="200" r="3" fill="#ffffff" />
    <circle cx="850" cy="200" r="10" fill="#7feeff" opacity="0.3" />
    <circle cx="1780" cy="180" r="3.5" fill="#ffffff" />
    <circle cx="1780" cy="180" r="12" fill="#c084fc" opacity="0.5" />
    <circle cx="1840" cy="850" r="3" fill="#7feeff" />

    <!-- Background Star Powder -->
    <circle cx="280" cy="320" r="1.2" fill="#7feeff" opacity="0.6" />
    <circle cx="390" cy="210" r="1" fill="#ffffff" opacity="0.5" />
    <circle cx="520" cy="450" r="1.5" fill="#c084fc" opacity="0.4" />
    <circle cx="680" cy="150" r="1" fill="#ffffff" opacity="0.7" />
    <circle cx="790" cy="620" r="1.3" fill="#7feeff" opacity="0.5" />
    <circle cx="980" cy="380" r="1.5" fill="#ffffff" opacity="0.6" />
    <circle cx="1100" cy="190" r="1.2" fill="#7feeff" opacity="0.5" />
    <circle cx="1250" cy="780" r="1.8" fill="#c084fc" opacity="0.6" />
    <circle cx="1380" cy="220" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="1620" cy="120" r="1.5" fill="#7feeff" opacity="0.7" />
    <circle cx="1720" cy="600" r="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Left Dark Gradient Vignette for Razor Sharp Text Contrast -->
  <rect width="900" height="100%" fill="url(#leftVignette)" />
  <defs>
    <linearGradient id="leftVignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020514" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#020514" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020514" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
