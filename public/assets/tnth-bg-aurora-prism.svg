<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020716" />
      <stop offset="40%" stop-color="#051230" />
      <stop offset="80%" stop-color="#091c4d" />
      <stop offset="100%" stop-color="#020614" />
    </linearGradient>

    <!-- Aurora Waves -->
    <linearGradient id="auroraEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="auroraMagenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="prismLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#7feeff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#e879f9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <filter id="auroraBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="95" />
    </filter>

    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#auroraDark)" />

  <!-- Aurora Northern Lights Layers -->
  <g filter="url(#auroraBlur)">
    <!-- Cyan Aurora Wave -->
    <path d="M 800 -100 Q 1200 400, 1600 200 T 2100 600 L 2100 -100 Z" fill="url(#auroraEmeraldCyan)" />
    <!-- Purple Aurora Curtain -->
    <path d="M 1000 200 Q 1400 700, 1800 450 T 2200 900 L 2200 100 Z" fill="url(#auroraMagenta)" />
    <!-- Bottom Right Glow -->
    <circle cx="1700" cy="850" r="500" fill="#3b82f6" opacity="0.22" />
  </g>

  <!-- Prism Ray Refractions & Glass Shards -->
  <g filter="url(#prismGlow)" fill="none">
    <path d="M 900 150 Q 1350 480, 1800 280 T 2150 700" stroke="url(#prismLine)" stroke-width="3" />
    <path d="M 980 230 Q 1420 540, 1850 350 T 2200 760" stroke="url(#prismLine)" stroke-width="1.8" opacity="0.7" />
    <path d="M 1060 310 Q 1490 600, 1900 420 T 2250 820" stroke="url(#prismLine)" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Geometric Diamond Facets (Prism Brand Vision Concept) -->
  <g transform="translate(1520, 420)" opacity="0.75" stroke="#7feeff" stroke-width="1.2" fill="rgba(127, 238, 255, 0.05)">
    <!-- Facet 1 -->
    <polygon points="0,-120 90,0 0,120 -90,0" />
    <polygon points="0,-120 45,0 0,120 -45,0" fill="rgba(168, 85, 247, 0.08)" stroke="#c084fc" />
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#7feeff" stroke-dasharray="4 4" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#ffffff" opacity="0.8" />
    
    <!-- Outer Floating Diamond Ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(127, 238, 255, 0.3)" stroke-width="1" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="230" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" stroke-dasharray="60 30" transform="rotate(25)" />
  </g>

  <!-- Left Vignette -->
  <rect width="850" height="100%" fill="url(#leftVigAurora)" />
  <defs>
    <linearGradient id="leftVigAurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020716" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#020716" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#020716" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
